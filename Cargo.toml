[package]
name = "coronatio"
version = "0.1.0"
edition = "2021"
description = "Coronatio: Rust appliance host for HOMESERVER service cartridges and infinite tabs"
license = "UNLICENSED"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time", "process", "io-util", "net"] }
tower-http = { version = "0.5", features = ["fs", "limit", "trace"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
url = "=2.4.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
cssparser = "0.35"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
